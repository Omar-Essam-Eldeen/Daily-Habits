    <title>21 Habits — ٢١ يوم عادات</title>
    <style>
      /* v3.2 boot splash: painted by the HTML itself, before any JS or CSS
         bundles arrive, so opening the app shows the artwork instantly.
         App.tsx fades it out once the app has mounted; the inline script
         below is a failsafe that removes it even if the app fails to load. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: #060d12;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.45s ease;
      }
      #boot-splash img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition-duration: 0.1s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/splash/splash.jpg" alt="" />
    </div>
    <div id="root"></div>
    <script>
      setTimeout(function () {
        var s = document.getElementById('boot-splash');
        if (s) {
          s.classList.add('boot-hide');
          setTimeout(function () {
            s.remove();
          }, 600);
        }
      }, 4500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
